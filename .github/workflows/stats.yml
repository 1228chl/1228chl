name: Generate GitHub Stats SVG

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 拉取完整历史，避免 rebase 问题

      - name: Generate metrics SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.svg
          base: header, activity
          config_timezone: Asia/Shanghai

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 先拉取远程最新代码，避免 push 冲突
          git pull --rebase origin main
          # 检查 metrics.svg 是否有变化
          if git diff --quiet metrics.svg && git diff --staged --quiet metrics.svg; then
            echo "No changes to commit"
          else
            git add metrics.svg
            git commit -m "Auto update stats [skip ci]"
            git push origin main
          fi
