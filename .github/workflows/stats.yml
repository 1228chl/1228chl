name: Generate GitHub Stats SVG

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics SVG and commit
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.svg
          base: header, activity          # 基础内容：头像+提交日历+最近活动
          config_timezone: Asia/Shanghai
          committer_branch: main
          commit_message: "Auto update stats [skip ci]"
          base64_images: yes

          # ========== 添加的插件 ==========
          # 1. 编程语言占比
          plugin_languages: yes
          plugin_languages_ignored: html, css   # 忽略 HTML/CSS，让统计更准确
          plugin_languages_limit: 8             # 最多显示8种语言

          # 2. 提交习惯（活跃时段、提交信息风格等）
          plugin_habits: yes
          plugin_habits_facts: yes              # 显示有趣的事实（如最常提交时间）
          plugin_habits_charts: yes             # 显示图表

          # 3. GitHub 成就勋章
          plugin_achievements: yes
          plugin_achievements_threshold: C      # 只显示达到 C 级及以上的成就（B、A 更稀有）
          plugin_achievements_secrets: yes      # 显示隐藏成就

          # 4. 最近项目活动（可选，展示你主要活跃的仓库）
          plugin_repositories: yes
          plugin_reositories_featured: 1228chl  # 可指定用户名，展示你自己的仓库
          plugin_repositories_skipped: ''       # 不跳过任何仓库

          # 5. 粉丝关注分析（可选，会显示共同关注）
          plugin_followup: yes
          plugin_followup_sections: repositories, user
