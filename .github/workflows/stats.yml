# Visit https://github.com/lowlighter/metrics#-documentation for full reference
name: Metrics & Snake

on:
  schedule: [{cron: "0 0 * * *"}]          # 每天 UTC 0 点运行
  workflow_dispatch:                       # 允许手动触发
  push: {branches: ["master", "main"]}    # 推送时也更新（可选）

jobs:
  # 1. 生成 GitHub 统计卡片（Metrics）
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}   # 使用你已有的带 repo 权限的 PAT
          user: 1228chl
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai
          config_base64: yes
          committer_branch: main
          committer_message: "Auto update stats [skip ci]"

          # 插件配置
          plugin_habits: no                     # 已关闭 habits 避免错误
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          plugin_leetcode: yes
          plugin_leetcode_user: 1228chl
          plugin_leetcode_sections: solved

          plugin_lines: yes
          plugin_lines_sections: base

  # 2. 生成贪吃蛇动画（Snake）
  generate-snake:
    runs-on: ubuntu-latest
    needs: github-metrics          # 等待 metrics 生成完成后再运行，避免冲突
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Generate snake SVG (light & dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: 1228chl
          outputs: |
            .github/assets/snake.svg
            .github/assets/snake-dark.svg?palette=github-dark

      - name: Commit and push snake images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/assets/ --force
          git commit -m "Update snake heatmap [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main --force
