# Visit https://github.com/lowlighter/metrics#-documentation for full reference
name: Metrics & Snake

on:
  schedule: [{cron: "0 0 * * *"}]          # 每天 UTC 0 点运行
  workflow_dispatch:                       # 允许手动触发
  push: {branches: ["master", "main"]}    # 推送时也更新（可选）

jobs:
  # ========== 1. 生成多个独立的统计卡片 ==========
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1.1 基础信息卡片（header, activity, community, repositories, metadata）
      - name: Generate base metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: 1228chl
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai
          config_base64: yes
          committer_branch: main
          committer_message: "Update base metrics [skip ci]"
          filename: base-metrics.svg
          # 禁用其他插件，只输出 base 内容
          plugin_languages: no
          plugin_leetcode: no
          plugin_lines: no

      # 1.2 编程语言统计卡片
      - name: Generate languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: 1228chl
          template: classic
          base: ""                      # 不显示基础头部，只显示语言插件
          config_timezone: Asia/Shanghai
          config_base64: yes
          committer_branch: main
          committer_message: "Update languages card [skip ci]"
          filename: languages.svg
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_languages_colors: github
          plugin_languages_categories: markup, programming
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          # 确保其他插件关闭
          plugin_leetcode: no
          plugin_lines: no

      # 1.3 LeetCode 统计卡片
      - name: Generate LeetCode card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: 1228chl
          template: classic
          base: ""                      # 独立卡片，不重复头部
          config_timezone: Asia/Shanghai
          config_base64: yes
          committer_branch: main
          committer_message: "Update LeetCode card [skip ci]"
          filename: leetcode.svg
          plugin_leetcode: yes
          plugin_leetcode_user: 1228chl
          plugin_leetcode_sections: solved
          plugin_leetcode_limit_skills: 10
          plugin_leetcode_limit_recent: 2
          plugin_languages: no
          plugin_lines: no

      # 1.4 代码行数统计卡片
      - name: Generate lines of code card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: 1228chl
          template: classic
          base: ""
          config_timezone: Asia/Shanghai
          config_base64: yes
          committer_branch: main
          committer_message: "Update lines card [skip ci]"
          filename: lines.svg
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_repositories_limit: 4
          plugin_lines_history_limit: 1
          plugin_languages: no
          plugin_leetcode: no

  # ========== 2. 生成贪吃蛇动画（与原配置一致） ==========
  generate-snake:
    runs-on: ubuntu-latest
    needs: github-metrics          # 等待 metrics 卡片生成完成后再运行，避免冲突
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Generate snake SVG (light & dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: 1228chl
          snake_speed: 0.5
          outputs: |
            .github/assets/snake.svg
            .github/assets/snake-dark.svg?palette=github-dark

      - name: Commit and push snake images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/assets/ --force
          git commit -m "Update snake heatmap [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main --force
